name: foodgram-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 158.160.159.158
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend,frontend,infra,data,docs
          target: /home/ubuntu/foodgram
          overwrite: true

      - name: Pull image and restart containers
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: 158.160.159.158
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            cd /home/ubuntu/foodgram/infra
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${DOCKER_USERNAME}/foodgram_backend:latest|" .env
            else
              echo "BACKEND_IMAGE=${DOCKER_USERNAME}/foodgram_backend:latest" >> .env
            fi
            echo "$DOCKER_PASSWORD" | sudo docker login -u "$DOCKER_USERNAME" --password-stdin
            sudo docker compose build frontend
            sudo docker compose pull backend
            sudo docker compose up -d --no-build
            sudo docker compose restart nginx
            sudo docker image prune -f
